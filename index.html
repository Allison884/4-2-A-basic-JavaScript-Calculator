<!DOCTYPE html>

<html>
<head>
<title> JavaScript 4-2  </title>

<script>
function add() {
    let a = document.getElementById("fn").value;
    let b = document.getElementById("sn").value;
    let c = Number(a) + Number(b);
    document.getElementById("ans").innerHTML = c;
}
    function sub() {
    let a = document.getElementById("fn").value;
    let b = document.getElementById("sn").value;
    let c = Number(a) - Number(b);
    document.getElementById("ans").innerHTML = c;
}

 function mult() {
    let a = document.getElementById("fn").value;
    let b = document.getElementById("sn").value;
    let c = Number(a) * Number(b);
    document.getElementById("ans").innerHTML = c;
}

     function div () {
    let a = document.getElementById("fn").value;
    let b = document.getElementById("sn").value;
    let c = Number(a) / Number(b);
    document.getElementById("ans").innerHTML = c;
}

</script>

</head>
<body>
<h3>To add your numbers fill in the blanks of what you are wanting to add than click the "=" sign.</h3>

<p>First number? <input id="fn"> <br>
Second number? <input id="sn"> <br>
<button onclick="add()"> + </button>
<button onclick="sub()"> - </button>
 <button onclick="mult()"> * </button>
    <button onclick="div()"> / </button>
</p>

<p>
    You Answer is: <span id="ans">____________</span>
</p>
  
</body>
</html>
